databaseChangeLog:
  - changeSet:
      id: 001-create-oferta_proyecto
      author: auto-apply-hub
      changes:
        - sql:
            sql: |
              CREATE TABLE auto_apply.oferta_proyecto (
                id                TEXT          NOT NULL,
                source_site       TEXT          NOT NULL,
                source_offer_id   TEXT          NOT NULL,
                title             TEXT          NOT NULL,
                description       TEXT          NOT NULL,
                skills            TEXT[]        NOT NULL DEFAULT '{}',
                budget_min        NUMERIC(12,2),
                budget_max        NUMERIC(12,2),
                currency          TEXT,
                published_at      TIMESTAMPTZ   NOT NULL,
                expires_at        TIMESTAMPTZ,
                status            TEXT          NOT NULL DEFAULT 'open',
                raw_payload       JSONB         NOT NULL DEFAULT '{}',
                created_at        TIMESTAMPTZ   NOT NULL DEFAULT now(),
                updated_at        TIMESTAMPTZ   NOT NULL DEFAULT now(),
                CONSTRAINT oferta_proyecto_pk PRIMARY KEY (id),
                CONSTRAINT oferta_proyecto_status_chk CHECK (status IN ('open', 'closed', 'archived'))
              );

              CREATE UNIQUE INDEX oferta_proyecto_source_idx
                ON auto_apply.oferta_proyecto (source_site, source_offer_id);

              CREATE INDEX oferta_proyecto_published_idx
                ON auto_apply.oferta_proyecto (published_at DESC);

              CREATE INDEX oferta_proyecto_skills_gin_idx
                ON auto_apply.oferta_proyecto USING GIN (skills);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS auto_apply.oferta_proyecto CASCADE;
